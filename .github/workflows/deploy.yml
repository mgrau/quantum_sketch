name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # This app builds against the misty_states source next door (Vite aliases
      # to ../misty_states), so both repos are checked out as siblings.
      - name: Checkout Quantum Sketch
        uses: actions/checkout@v4
        with:
          path: quantum_sketch
      - name: Checkout misty_states (drawing library)
        uses: actions/checkout@v4
        with:
          repository: mgrau/misty_states
          path: misty_states
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: quantum_sketch
        run: npm ci
      - name: Build
        working-directory: quantum_sketch
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quantum_sketch/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
